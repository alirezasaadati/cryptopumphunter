name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/telegram-kv-quota-fallback]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Adaptive Sniper 60-day comparison
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'adaptive-sniper-backtest')
        run: node scripts/adaptive-sniper-backtest.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'adaptive-sniper-backtest')
        with:
          name: adaptive-sniper-backtest
          path: artifacts/
          if-no-files-found: warn
