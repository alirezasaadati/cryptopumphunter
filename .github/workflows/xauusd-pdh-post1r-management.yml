name: XAUUSD PDH PDL post-1R management test
on:
  push:
    branches: [experiment/xauusd-pdh-post1r-management]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check scripts/xauusd-pdh-post1r-management.mjs
      - run: node scripts/xauusd-pdh-post1r-management.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd-pdh-post1r-management
          path: artifacts/xauusd-pdh-post1r-management.*
          if-no-files-found: warn
          retention-days: 30
