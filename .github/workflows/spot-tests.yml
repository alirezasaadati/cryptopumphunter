name: Isolated Spot tests
on:
  push:
    branches:
      - feat/independent-spot-usd-usdt-20261124
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
