name: Breakout Retest LONG Engine Tests
on:
  push:
    branches:
      - experimental/breakout-retest-long
    paths:
      - 'src/futures-breakout-retest-long.js'
      - 'src/futures-breakout-retest-long-a.js'
      - 'src/ema-pullback-long.js'
      - 'scripts/ema-pullback-long.test.mjs'
      - 'scripts/futures-breakout-retest-long.test.mjs'
      - 'scripts/futures-breakout-retest-long-a.test.mjs'
      - '.github/workflows/breakout-retest-long-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
