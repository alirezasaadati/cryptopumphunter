name: Isolated Futures Backtest Audit

on:
  push:
    branches:
      - audit/futures-backtest-20261125

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run full automated test suite
        run: npm test

      - name: Run pinned 30-day Kraken Futures lifecycle backtest
        env:
          BACKTEST_END_MS: "1795527325576"
          LIFECYCLE_BACKTEST_DAYS: "30"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
          BACKTEST_SYMBOLS: "PF_XBTUSD,PF_ETHUSD,PF_SOLUSD,PF_HYPEUSD,PF_ZECUSD,PF_NVDAXUSD,PF_XRPUSD,PF_NEARUSD,PF_ANTXUSD,PF_UNIUSD"
        run: node scripts/backtest-futures-lifecycle.mjs

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: futures-backtest-audit-2026-11-25
          path: |
            artifacts/futures-lifecycle-backtest.json
            artifacts/futures-lifecycle-backtest.md
          if-no-files-found: error
          retention-days: 14
