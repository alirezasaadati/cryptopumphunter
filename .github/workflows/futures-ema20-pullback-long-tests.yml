name: EMA20 Pullback LONG Tests
on:
  push:
    branches: [experimental/ema20-pullback-long]
  pull_request:
    branches: [main]
    paths:
      - "src/futures-ema20-pullback-long.js"
      - "scripts/futures-ema20-pullback-long.test.mjs"
      - "package.json"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
