name: Compare PA v2.3 vs futures v4.7 (no holding-time cap)
on:
  push:
    branches: ["backtest/pa-v23-v47-no-time-limit"]
    paths:
      - "scripts/compare-pa-v23-v47.mjs"
      - "scripts/vendor/price-action-engine-v2.3.js"
      - ".github/workflows/compare-pa-v23-v47.yml"
      - "src/index.js"
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  historical-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax validation
        run: |
          node --check src/index.js
          node --check scripts/vendor/price-action-engine-v2.3.js
          node --check scripts/compare-pa-v23-v47.mjs
      - name: Run 90d and 180d comparison
        env:
          BACKTEST_SYMBOLS: "8"
        run: node scripts/compare-pa-v23-v47.mjs
      - name: Upload complete reports and candle data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa-v23-v47-no-time-limit-results
          path: artifacts/pa-v23-vs-v47/
          if-no-files-found: warn
          retention-days: 30