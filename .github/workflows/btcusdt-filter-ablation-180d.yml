name: BTCUSDT 180-day walk-forward filter ablation
on:
  push:
    branches: [experiment/btcusdt-filter-ablation-90d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  btc-only-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Repository tests
        run: npm test
      - name: 180-day BTCUSDT walk-forward filter ablation
        run: node scripts/btcusdt-filter-ablation-180d.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btcusdt-filter-ablation-180d
          path: artifacts/btcusdt-filter-ablation-180d.*
          if-no-files-found: warn
          retention-days: 30
