name: v10.4 one-year historical backtest
on:
  push:
    branches: [backtest-v10-4-one-year-20261122]
    paths:
      - "scripts/backtest-v10-4-one-year.mjs"
      - ".github/workflows/v10-4-one-year-backtest.yml"
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v10.4 historical backtest
        env:
          BT_SYMBOLS: "30"
        run: node scripts/backtest-v10-4-one-year.mjs
      - name: Upload v10.4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-4-one-year
          path: artifacts/
          if-no-files-found: warn
