name: Entry and Volume Experiments

on:
  push:
    branches:
      - experiment/volume-entry-freshness
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and unit tests
        run: |
          node --check src/index.js
          node --check scripts/backtest-kraken.mjs
          node --test scripts/*.test.mjs
      - name: Run 30-day entry and volume comparison
        env:
          BACKTEST_DAYS: 30
          BACKTEST_SYMBOLS: 5
          BACKTEST_FEE: 0.0005
          BACKTEST_SLIPPAGE: 0.0003
        run: node scripts/backtest-kraken.mjs
      - name: Upload experiment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-entry-volume-experiments
          path: artifacts/kraken-entry-volume-experiments.*
          if-no-files-found: warn
          retention-days: 30
