name: Validate Crypto Pump Hunter v3.9.0

on:
  pull_request:
    branches: [main]
    paths:
      - "src/index.js"
      - "scripts/smoke-kraken.mjs"
      - "scripts/futures-engine.test.mjs"
      - ".github/workflows/validate-v390.yml"
  push:
    branches: ["feature/v3.9.0"]
    paths:
      - "src/index.js"
      - "scripts/smoke-kraken.mjs"
      - "scripts/futures-engine.test.mjs"
      - ".github/workflows/validate-v390.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
      - name: Check Kraken smoke-test syntax
        run: node --check scripts/smoke-kraken.mjs
      - name: Run offline futures strategy tests
        run: node --test scripts/futures-engine.test.mjs
      - name: Smoke-test public Kraken Futures ticker and candle APIs
        run: node scripts/smoke-kraken.mjs
