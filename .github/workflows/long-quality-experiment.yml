name: Long Quality Experiment Checks
on:
  push:
    branches:
      - backtest/long-quality-ab-20261124
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run full test suite
        run: npm test
      - name: Fetch historical Kraken Futures candles
        run: node scripts/fetch-historical-kraken-candles.mjs
      - name: Upload historical candle dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-historical-candles
          path: data/historical-kraken/
          if-no-files-found: warn
          retention-days: 7
