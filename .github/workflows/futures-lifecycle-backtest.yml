name: Experimental futures lifecycle backtest
on:
  workflow_dispatch:
  push:
    branches: [backtest/main-engine-tp30-90d-180d-20261122]
    paths:
      - "backtest-trigger.txt"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run lifecycle historical backtest
        env:
          LIFECYCLE_BACKTEST_DAYS: "180"
          LIFECYCLE_BACKTEST_SYMBOLS: "12"
        run: node scripts/backtest-futures-lifecycle.mjs
      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-engine-tp30-180d
          path: artifacts/
          if-no-files-found: error
