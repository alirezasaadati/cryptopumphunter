name: Experimental futures lifecycle backtest
on:
  workflow_dispatch:
  push:
    branches: [feature/leveraged-profit-close-lifecycle, experiment/ema20-limit-entry-backtest, experiment/long-atr2-tp13-margin100, experiment/short-entry-90-180-analysis]
    paths:
      - "scripts/backtest-futures-lifecycle.mjs"
      - ".github/workflows/futures-lifecycle-backtest.yml"
      - "src/futures-trade-lifecycle.js"
      - "src/index.js"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        days: [90, 180]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run lifecycle historical backtest
        env:
          LIFECYCLE_BACKTEST_DAYS: "${{ matrix.days }}"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
          LIFECYCLE_BACKTEST_END: "2026-11-22T20:18:19.124Z"
        run: node scripts/backtest-futures-lifecycle.mjs
      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-short-entry-${{ matrix.days }}d-backtest
          path: artifacts/
          if-no-files-found: error
