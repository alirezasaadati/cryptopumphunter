name: Current vs V4.8 fixed-margin comparison
on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/v48-r-scaled-btc-gated-20261123]
  push:
    branches: [feature/leveraged-profit-close-lifecycle, experiment/v48-r-scaled-btc-gated-20261123, experiment/compare-current-v48-15pct-20261123]
    paths:
      - "scripts/backtest-futures-lifecycle.mjs"
      - "scripts/backtest-fixed-margin-target.mjs"
      - "scripts/backtest-engine-comparison.mjs"
      - "scripts/backtest-v48-short-30pct.mjs"
      - "src/index-current.js"
      - ".github/workflows/futures-lifecycle-backtest.yml"
      - "src/futures-trade-lifecycle.js"
      - "src/index.js"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run same-data engine comparison
        env:
          LIFECYCLE_BACKTEST_DAYS: "60"
          LIFECYCLE_BACKTEST_END: "2026-09-24T10:37:00Z"
          BACKTEST_TAKER_FEE_RATE: "0.0005"
          BACKTEST_SLIPPAGE_RATE: "0.0002"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
        run: node scripts/backtest-engine-comparison.mjs
      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-vs-v48-engine-comparison
          path: artifacts/
          if-no-files-found: error
