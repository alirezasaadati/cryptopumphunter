name: Futures historical regime comparison

on:
  push:
    branches:
      - experimental/futures-backtest-60d
    paths:
      - "scripts/backtest-futures-bull-market.mjs"
      - "scripts/futures-independent-signals.test.mjs"
      - "src/futures-independent-signals.js"
      - ".github/workflows/futures-bull-market-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futures-regime-comparison
  cancel-in-progress: false

jobs:
  backtest:
    name: "${{ matrix.regime.name }} market"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Re-trigger full three-regime matrix after the prior run unexpectedly omitted bull.
      matrix:
        regime:
          - name: bull-2023-q4
            start_ms: "1696118400000"
            end_ms: "1704067200000"
            artifact: futures-regime-bull-2023-q4
          - name: bear-2022-q2
            start_ms: "1651363200000"
            end_ms: "1659312000000"
            artifact: futures-regime-bear-2022-q2
          - name: sideways-2023-summer
            start_ms: "1685577600000"
            end_ms: "1693526400000"
            artifact: futures-regime-sideways-2023-summer
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental/futures-backtest-60d
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Run current and independent engine backtests
        env:
          LIFECYCLE_BACKTEST_START_MS: "${{ matrix.regime.start_ms }}"
          LIFECYCLE_BACKTEST_END_MS: "${{ matrix.regime.end_ms }}"
          LIFECYCLE_BACKTEST_DAYS: "92"
          LIFECYCLE_BACKTEST_SYMBOLS: "9"
          LIFECYCLE_BREAK_EVEN_MARGIN_PCT: "0"
          LIFECYCLE_STRUCTURAL_STOP_MODE: "original"
          LIFECYCLE_ENTRY_PULLBACK_PCT: "0"
          LIFECYCLE_RISK_PER_TRADE_PCT: "1"
          LIFECYCLE_BACKTEST_SYMBOL_LIST: "PF_XBTUSD,PF_ETHUSD,PF_SOLUSD,PF_XRPUSD,PF_ADAUSD,PF_DOGEUSD,PF_LINKUSD,PF_LTCUSD,PF_BCHUSD"
        run: node scripts/backtest-futures-bull-market.mjs
      - name: Upload regime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.regime.artifact }}
          path: |
            artifacts/futures-lifecycle-backtest.json
            artifacts/futures-lifecycle-backtest.md
          if-no-files-found: warn
          retention-days: 30
