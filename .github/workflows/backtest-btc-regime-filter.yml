name: BTC regime filter historical comparison
on:
  push:
    branches: [experiment/btc-regime-capital-10usd-10x-tp30]
    paths:
      - "scripts/backtest-btc-regime-filter.mjs"
      - ".github/workflows/backtest-btc-regime-filter.yml"
      - "src/index.js"
      - "src/futures-trade-lifecycle.js"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Kraken BTC regime comparison
        run: node scripts/backtest-btc-regime-filter.mjs
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-regime-filter-comparison
          path: artifacts/
          if-no-files-found: warn
