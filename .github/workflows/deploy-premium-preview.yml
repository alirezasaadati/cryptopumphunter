name: Deploy isolated premium UI preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-black-gold-english
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Run focused UI and card tests
        run: node --test scripts/menu-layout.test.mjs scripts/futures-alerts.test.mjs scripts/signal-card.test.mjs
      - name: Deploy isolated Cloudflare Worker Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_TEST_KEY: ${{ secrets.PREVIEW_TEST_KEY }}
        run: |
          set -euo pipefail
          npx wrangler@4.135.0 preview --name ui-premium-black-gold --message "Controlled owner-only signal-card delivery test" 2>&1 | tee /tmp/preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+workers\.dev' /tmp/preview.log | head -n 1)"
          test -n "$PREVIEW_URL"
          test -n "$PREVIEW_TEST_KEY"
          printf '%s' "$PREVIEW_TEST_KEY" | npx wrangler@4.135.0 preview secret put PREVIEW_TEST_KEY --name ui-premium-black-gold
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $PREVIEW_TEST_KEY" \
            "$PREVIEW_URL/__preview/test-card"
