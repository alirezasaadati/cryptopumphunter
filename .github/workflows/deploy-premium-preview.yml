name: Deploy isolated premium UI preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-black-gold-english
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Run focused UI and card tests
        run: node --test scripts/menu-layout.test.mjs scripts/futures-alerts.test.mjs scripts/signal-card.test.mjs
      - name: Deploy isolated Cloudflare Worker Preview
        run: npx wrangler@4.135.0 preview --name ui-premium-black-gold --message "Controlled owner-only signal-card delivery test" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
