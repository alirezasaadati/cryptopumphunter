name: Futures 60-day SHORT volume-filter experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/futures-backtest-60d
    paths:
      - "scripts/backtest-futures-volume-filter.mjs"
      - ".github/workflows/futures-backtest-volume-filter-60d.yml"

permissions:
  contents: read

concurrency:
  group: futures-backtest-volume-filter-60d
  cancel-in-progress: false

jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: volume-1.50
            volume: "1.50"
            atr: "0"
            ema: "0"
          - name: volume-1.75
            volume: "1.75"
            atr: "0"
            ema: "0"
          - name: volume-2.00
            volume: "2.00"
            atr: "0"
            ema: "0"
          - name: volume-2.25
            volume: "2.25"
            atr: "0"
            ema: "0"
          - name: atr-min-0.50
            volume: "0"
            atr: "0.50"
            ema: "0"
          - name: atr-min-0.80
            volume: "0"
            atr: "0.80"
            ema: "0"
          - name: atr-min-1.00
            volume: "0"
            atr: "1.00"
            ema: "0"
          - name: ema-extension-max-0.50
            volume: "0"
            atr: "0"
            ema: "0.50"
          - name: ema-extension-max-1.00
            volume: "0"
            atr: "0"
            ema: "1.00"
          - name: ema-extension-max-1.50
            volume: "0"
            atr: "0"
            ema: "1.50"
          - name: combo-volume-1.75-atr-1.00
            volume: "1.75"
            atr: "1.00"
            ema: "0"
          - name: combo-volume-1.75-ema-0.50
            volume: "1.75"
            atr: "0"
            ema: "0.50"
          - name: combo-atr-1.00-ema-0.50
            volume: "0"
            atr: "1.00"
            ema: "0.50"
          - name: combo-volume-atr-ema
            volume: "1.75"
            atr: "1.00"
            ema: "0.50"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental/futures-backtest-60d
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Run 60-day SHORT volume-filter experiment
        env:
          LIFECYCLE_BACKTEST_DAYS: "60"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
          LIFECYCLE_BACKTEST_END_MS: "1790090998724"
          LIFECYCLE_SHORT_MAX_VOLUME_RATIO: ${{ matrix.volume }}
          LIFECYCLE_SHORT_MIN_ATR_PCT: ${{ matrix.atr }}
          LIFECYCLE_SHORT_MAX_EMA20_DISTANCE_PCT: ${{ matrix.ema }}
        run: node scripts/backtest-futures-volume-filter.mjs
      - name: Upload experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-lifecycle-${{ matrix.name }}-60d
          path: |
            artifacts/futures-lifecycle-backtest.json
            artifacts/futures-lifecycle-backtest.md
          if-no-files-found: warn
          retention-days: 30
