name: Futures 60-day SHORT volume-filter experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/futures-backtest-60d
    paths:
      - "scripts/backtest-futures-volume-filter.mjs"
      - ".github/workflows/futures-backtest-volume-filter-60d.yml"

permissions:
  contents: read

concurrency:
  group: futures-backtest-volume-filter-60d
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental/futures-backtest-60d
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Run 60-day SHORT volume-filter experiment
        env:
          LIFECYCLE_BACKTEST_DAYS: "60"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
          LIFECYCLE_BACKTEST_END_MS: "1790090998724"
          LIFECYCLE_SHORT_MAX_VOLUME_RATIO: "2"
        run: node scripts/backtest-futures-volume-filter.mjs
      - name: Upload experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-lifecycle-volume-filter-60d
          path: |
            artifacts/futures-lifecycle-backtest.json
            artifacts/futures-lifecycle-backtest.md
          if-no-files-found: warn
          retention-days: 30
