name: v10.6 corrected vs current engine — one year
on:
  push:
    branches:
      - backtest-v106-v47-one-year-20261122
    paths:
      - "scripts/backtest-v106-vs-current-one-year.mjs"
      - ".github/workflows/v106-vs-current-one-year.yml"
      - "BACKTEST_TRIGGER"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 365-day same-data comparison
        run: node scripts/backtest-v106-vs-current-one-year.mjs
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v106-vs-current-one-year
          path: artifacts/
          if-no-files-found: error
