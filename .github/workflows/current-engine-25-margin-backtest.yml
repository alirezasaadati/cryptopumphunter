name: Production engine 25% margin ROI backtest
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/backtest-current-engine-25-margin.mjs"
      - ".github/workflows/current-engine-25-margin-backtest.yml"
      - "src/index.js"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days"
        required: false
        default: "90"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: BACKTEST_DAYS="${{ inputs.days || '90' }}" node scripts/backtest-current-engine-25-margin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-engine-25-margin-backtest
          path: artifacts/
          if-no-files-found: warn
