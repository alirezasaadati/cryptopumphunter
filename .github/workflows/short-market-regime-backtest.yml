name: SHORT market regime backtest # research-only
on:
  push:
    branches: [experiment/short-market-regime-90-180]
    paths:
      - "scripts/backtest-short-market-regime.mjs"
      - ".github/workflows/short-market-regime-backtest.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 90d and 180d historical regime backtests
        run: node scripts/backtest-short-market-regime.mjs
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-market-regime-backtest
          path: artifacts/
          if-no-files-found: warn
