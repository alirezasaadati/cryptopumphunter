name: "Experimental regime-split LONG and SHORT backtests"
on:
  workflow_dispatch:
  push:
    branches:
      - experimental/regime-split-short-backtest
      - experimental/breakout-retest-long
      - experimental/ema-pullback-long-filters-v2
      - experimental/ema-pullback-long-optimized-python-v2
      - experimental/ema-pullback-long-balanced-v3
      - experimental/ema-pullback-long-tp-evaluation
    paths:
      - "src/futures-breakout-retest-long.js"
      - "src/futures-breakout-retest-long-a.js"
      - "src/ema-pullback-long.js"
      - "scripts/ema-pullback-long.test.mjs"
      - "scripts/backtest-breakout-retest-long.mjs"
      - "scripts/backtest-breakout-retest-long.test.mjs"
      - "scripts/backtest-kraken-short-regime.mjs"
      - "scripts/backtest-current-engine-30-margin.mjs"
      - ".github/workflows/breakout-retest-long-backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Run matched historical LONG backtest
        env:
          BREAKOUT_BACKTEST_DAYS: "60"
        run: node scripts/backtest-breakout-retest-long.mjs
      - name: Run isolated 60-day bearish-regime SHORT backtest
        run: node scripts/backtest-kraken-short-regime.mjs
      - name: Run full current Production engine 30% margin ROI backtest
        env:
          CURRENT_ENGINE_BACKTEST_DAYS: "60"
        run: node scripts/backtest-current-engine-30-margin.mjs
      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-split-backtest-reports
          path: artifacts/
          if-no-files-found: warn
