name: Experimental breakout-retest LONG A-B historical comparison
on:
  workflow_dispatch:
  push:
    branches:
      - experimental/breakout-retest-long
    paths:
      - "src/futures-breakout-retest-long.js"
      - "src/futures-breakout-retest-long-a.js"
      - "src/ema-pullback-long.js"
      - "scripts/ema-pullback-long.test.mjs"
      - "scripts/backtest-breakout-retest-long.mjs"
      - "scripts/backtest-breakout-retest-long.test.mjs"
      - ".github/workflows/breakout-retest-long-backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Run matched historical A-B backtest
        env:
          BREAKOUT_BACKTEST_DAYS: "60"
        run: node scripts/backtest-breakout-retest-long.mjs
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakout-retest-long-comparison
          path: artifacts/
          if-no-files-found: warn
