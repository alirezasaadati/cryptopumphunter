name: Current futures engine backtest
on:
  workflow_dispatch:
  push:
    branches: [add-entry-quality-filters]
    paths:
      - "scripts/backtest-kraken.mjs"
      - ".github/workflows/current-engine-backtest.yml"
      - "src/index.js"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run historical backtest
        env:
          BACKTEST_DAYS: "60"
          BACKTEST_SYMBOLS: "24"
          BACKTEST_FEE: "0.0005"
          BACKTEST_SLIPPAGE: "0.0003"
        run: node scripts/backtest-kraken.mjs
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-engine-backtest
          path: artifacts/
          if-no-files-found: warn
