name: v6.4.0 LONG mean-reversion backtest
on:
  workflow_dispatch:
  push:
    branches: [add-entry-quality-filters]
    paths:
      - "scripts/backtest-v640-mean-reversion.mjs"
      - ".github/workflows/current-engine-backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v6.4.0 historical backtest
        env:
          BACKTEST_SYMBOLS: "PF_XBTUSD,PF_ETHUSD,PF_SOLUSD,PF_XRPUSD,PF_DOGEUSD,PF_ADAUSD,PF_LINKUSD,PF_LTCUSD,PF_BCHUSD,PF_AVAXUSD"
        run: node scripts/backtest-v640-mean-reversion.mjs
      - name: Upload v6.4.0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v640-long-mean-reversion-backtest
          path: artifacts/
          if-no-files-found: warn
