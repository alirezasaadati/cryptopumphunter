name: v7.1.1 LONG Hybrid historical backtest
on:
  push:
    branches: [backtest/v711-long-hybrid-20261122]
    paths:
      - "scripts/backtest-v711-long-hybrid.mjs"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v7.1.1 historical backtest
        run: node scripts/backtest-v711-long-hybrid.mjs
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v711-long-hybrid-backtest
          path: artifacts/
          if-no-files-found: warn
