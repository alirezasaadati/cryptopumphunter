name: BTC seven trend methods benchmark
on:
  push:
    branches:
      - experiment/btc-seven-trend-methods
    paths:
      - "research/btc_trend_methods.py"
      - ".github/workflows/btc-seven-trend-methods.yml"
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run BTC-only walk-forward benchmark
        run: python research/btc_trend_methods.py
      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-seven-trend-methods
          path: artifacts/btc-trend-*
          if-no-files-found: warn
