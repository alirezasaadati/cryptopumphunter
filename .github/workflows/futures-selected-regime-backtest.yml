name: Futures selected engines by BTC market regime

on:
  push:
    branches:
      - experimental/futures-backtest-60d
    paths:
      - "scripts/backtest-selected-regime-engines.mjs"
      - "scripts/futures-market-regime.mjs"
      - "scripts/futures-independent-signals.test.mjs"
      - "src/futures-independent-signals.js"
      - ".github/workflows/futures-selected-regime-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futures-selected-regime-portfolio
  cancel-in-progress: false

jobs:
  backtest:
    name: "${{ matrix.period.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        period:
          - name: 2022-q2-bear
            start_ms: "1651363200000"
            end_ms: "1659312000000"
            artifact: selected-regime-2022-q2-bear
          - name: 2023-q2-q3-range
            start_ms: "1685577600000"
            end_ms: "1693526400000"
            artifact: selected-regime-2023-q2-q3
          - name: 2023-q4-bull
            start_ms: "1696118400000"
            end_ms: "1704067200000"
            artifact: selected-regime-2023-q4-bull
          - name: 2024-q1-bull
            start_ms: "1704067200000"
            end_ms: "1711929600000"
            artifact: selected-regime-2024-q1-bull
          - name: 2024-q2-mixed
            start_ms: "1711929600000"
            end_ms: "1719792000000"
            artifact: selected-regime-2024-q2-mixed
          - name: 2024-q3-range
            start_ms: "1719792000000"
            end_ms: "1727740800000"
            artifact: selected-regime-2024-q3-range
          - name: 2024-q4-bull
            start_ms: "1727740800000"
            end_ms: "1735689600000"
            artifact: selected-regime-2024-q4-bull
          - name: 2025-q1-bear
            start_ms: "1735689600000"
            end_ms: "1743465600000"
            artifact: selected-regime-2025-q1-bear
          - name: 2025-q2-bull
            start_ms: "1743465600000"
            end_ms: "1751328000000"
            artifact: selected-regime-2025-q2-bull
          - name: 2025-q3-mixed
            start_ms: "1751328000000"
            end_ms: "1759276800000"
            artifact: selected-regime-2025-q3-mixed
          - name: 2025-q4-bear
            start_ms: "1759276800000"
            end_ms: "1767225600000"
            artifact: selected-regime-2025-q4-bear
          - name: 2026-q1-mixed
            start_ms: "1767225600000"
            end_ms: "1775001600000"
            artifact: selected-regime-2026-q1-mixed
          - name: 2026-q2-bull
            start_ms: "1775001600000"
            end_ms: "1782864000000"
            artifact: selected-regime-2026-q2-bull
          - name: 2026-q3-mixed
            start_ms: "1782864000000"
            end_ms: "1790812800000"
            artifact: selected-regime-2026-q3-mixed
    steps:
      - name: Checkout experimental branch only
        uses: actions/checkout@v4
        with:
          ref: experimental/futures-backtest-60d
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Run selected-engine historical backtest
        env:
          LIFECYCLE_BACKTEST_START_MS: "${{ matrix.period.start_ms }}"
          LIFECYCLE_BACKTEST_END_MS: "${{ matrix.period.end_ms }}"
          LIFECYCLE_BACKTEST_DAYS: "92"
          LIFECYCLE_BACKTEST_SYMBOLS: "9"
          LIFECYCLE_BREAK_EVEN_MARGIN_PCT: "0"
          LIFECYCLE_STRUCTURAL_STOP_MODE: "original"
          LIFECYCLE_ENTRY_PULLBACK_PCT: "0"
          LIFECYCLE_RISK_PER_TRADE_PCT: "1"
          LIFECYCLE_BACKTEST_SYMBOL_LIST: "PF_XBTUSD,PF_ETHUSD,PF_SOLUSD,PF_XRPUSD,PF_ADAUSD,PF_DOGEUSD,PF_LINKUSD,PF_LTCUSD,PF_BCHUSD"
        run: node scripts/backtest-selected-regime-engines.mjs
      - name: Upload selected portfolio report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.period.artifact }}
          path: |
            artifacts/futures-lifecycle-backtest.json
            artifacts/futures-lifecycle-backtest.md
          if-no-files-found: warn
          retention-days: 30
