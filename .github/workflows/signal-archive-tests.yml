name: Signal Archive Tests

on:
  push:
    branches:
      - "feature/price-action-archive-ui"
    paths:
      - "src/signal-archive.js"
      - "src/index.js"
      - "scripts/signal-archive.test.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
