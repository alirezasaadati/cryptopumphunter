name: v7.1.1 TP 30 percent margin backtest
on:
  push:
    branches: [backtest/v711-tp30-margin-20261122]
    paths:
      - "scripts/backtest-v711-tp30-margin.mjs"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fixed TP backtest
        run: node scripts/backtest-v711-tp30-margin.mjs
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v711-tp30-margin-backtest
          path: artifacts/
          if-no-files-found: warn
