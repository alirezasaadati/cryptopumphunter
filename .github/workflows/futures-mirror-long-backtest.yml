name: Futures mirror-long historical comparison
on:
  workflow_dispatch:
  push:
    branches: [experimental/futures-mirror-long]
    paths:
      - "src/futures-mirror-long.js"
      - "scripts/backtest-mirror-long-comparison.mjs"
      - ".github/workflows/futures-mirror-long-backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Run 180-day matched bullish-regime comparison
        env:
          LIFECYCLE_BACKTEST_DAYS: "180"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
          LIFECYCLE_BACKTEST_START_MS: "0"
        run: node scripts/backtest-mirror-long-comparison.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: futures-mirror-long-comparison
          path: artifacts/futures-mirror-long-comparison.*
