name: Validate production hotfix
on:
  push:
    branches:
      - fix/cron-kv-capital-guide-20261125
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax check
        run: npm run check
      - name: Cloudflare dry-run build
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry-run
