name: Code checks

on:
  push:
    branches: [main, feature/permanent-signal-ledger, experiment/current-engine-25-margin-target]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        volume_threshold: ["0.75"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax and unit tests
        run: npm test
      - name: Production engine 25% margin ROI backtest (volume threshold ${{ matrix.volume_threshold }})
        env:
          BACKTEST_DAYS: "90"
          VOLUME_THRESHOLD: ${{ matrix.volume_threshold }}
        run: node scripts/backtest-current-engine-25-margin.mjs
        timeout-minutes: 35
      - name: Cloudflare Worker dry-run build
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry-run
      - name: Upload production signal diagnostics
        if: matrix.volume_threshold == '0.75'
        uses: actions/upload-artifact@v4
        with:
          name: production-signal-quality-diagnostics
          path: artifacts/current-engine-25-margin-backtest.json
          if-no-files-found: error
          retention-days: 14
