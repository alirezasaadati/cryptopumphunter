name: Code checks

on:
  push:
    branches: [main, feature/permanent-signal-ledger, feat/independent-spot-usd-usdt-20261124]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax and unit tests
        run: npm test
      - name: Cloudflare Worker dry-run build
        if: always()
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry-run
