name: Price Action Confirmation Matrix
on:
  pull_request:
    paths:
      - "scripts/backtest-price-action.mjs"
      - "src/price-action-engine.js"
      - "scripts/price-action-engine.test.mjs"
      - ".github/workflows/price-action-backtest.yml"
      - "package.json"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        confirmation: [baseline, macd, volume, macd_volume]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run engine unit tests
        run: node --test scripts/price-action-engine.test.mjs
      - name: Run historical Price Action backtest
        run: node scripts/backtest-price-action.mjs
        env:
          PA_BACKTEST_DAYS: "14"
          PA_BACKTEST_OFFSET_DAYS: "14"
          PA_BACKTEST_SYMBOLS: "5"
          PA_BACKTEST_CONFIRMATION: ${{ matrix.confirmation }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-action-${{ matrix.confirmation }}-report
          path: artifacts/
          if-no-files-found: warn
