name: PA v2.1 BTC one-year backtest with unlimited holding
on:
  push:
    branches:
      - experiment/pa-v21-btc-unlimited-hold
    paths:
      - "src/price-action-engine.js"
      - "scripts/backtest-btc-1y.mjs"
      - ".github/workflows/pa-v2-exact-btc-backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact source files
        run: |
          test -s src/price-action-engine.js
          test -s scripts/backtest-btc-1y.mjs
          node --check src/price-action-engine.js
          node --check scripts/backtest-btc-1y.mjs
      - name: Run unchanged backtest with default settings
        run: node scripts/backtest-btc-1y.mjs
      - name: Upload complete reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa-v21-btc-1y-unlimited-hold
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
