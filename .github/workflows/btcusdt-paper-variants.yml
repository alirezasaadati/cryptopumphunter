name: BTCUSDT paper variants (manual, isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Repository tests
        run: npm test
      - name: Run BTCUSDT paper comparison (up to 5h 50m)
        run: timeout 340m node scripts/btcusdt-paper-variants.mjs --watch
      - name: Upload paper ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-paper-ledger
          path: artifacts/btcusdt-paper-state.json
          if-no-files-found: warn
          retention-days: 30
