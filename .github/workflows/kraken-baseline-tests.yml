name: Kraken baseline test comparison
on:
  push:
    branches:
      - diagnostic/kraken-baseline-tests-20261125
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run unchanged baseline test suite
        run: npm test
