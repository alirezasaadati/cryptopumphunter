name: Futures backtest diagnostics
on:
  push:
    branches: [backtest-three-engines]
    paths:
      - "scripts/backtest-diagnostics.mjs"
      - "scripts/candidate-engine.mjs"
      - "src/index.js"
      - ".github/workflows/backtest-diagnostics.yml"
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check scripts/backtest-diagnostics.mjs
      - name: Run diagnostic backtests
        env:
          BACKTEST_DAYS: "365"
          BACKTEST_SYMBOLS: "8"
          BACKTEST_FEE: "0.0005"
          BACKTEST_SLIPPAGE: "0.0003"
          BACKTEST_RANDOM_SEEDS: "100"
        run: node scripts/backtest-diagnostics.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-backtest-diagnostics
          path: artifacts/
          if-no-files-found: warn
