name: Archive delivery regression checks

on:
  pull_request:
    paths:
      - "src/index.js"
      - "scripts/archive-delivery-concurrency.test.mjs"
      - "scripts/signal-ledger.integration.test.mjs"
      - ".github/workflows/archive-delivery-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Archive reservation concurrency test
        run: node --test scripts/archive-delivery-concurrency.test.mjs
      - name: Multi-recipient archive fan-out regression test
        run: >-
          node --test
          --test-name-pattern="automated fan-out publishes each signal to the archive exactly once|a concurrent archive reservation is reported as in-progress, not uncertain"
          scripts/signal-ledger.integration.test.mjs
      - name: Cloudflare Worker dry-run build
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry-run
