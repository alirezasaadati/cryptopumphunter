name: Engine B short-only isolated paper backtest

on:
  push:
    branches:
      - feature/dual-engine-ab
    paths:
      - "scripts/dual-engine-backtest.mjs"
      - ".github/workflows/b-only-paper-backtest.yml"

permissions:
  contents: read

jobs:
  b-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKTEST_DAYS: "90"
      DIRECTIONAL_MODE: "B_ONLY"
      ENTRY_NOTIONAL_USD: "100"
      FEE_RATE: "0.0005"
      SLIPPAGE_BPS: "2"
      MAX_HOLD_BARS: "500"
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: npm test
      - name: Run isolated B-only paper simulation
        run: node scripts/dual-engine-backtest.mjs
      - name: Upload B-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-only-paper-backtest
          path: artifacts/dual-engine-backtest.json
          if-no-files-found: warn
          retention-days: 14
