name: v8.0.0 LONG 4H historical backtest
on:
  push:
    branches: [backtest-v800-long-4h-20261122]
    paths:
      - "scripts/backtest-v800-long-4h.mjs"
      - ".github/workflows/v800-long-4h-backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run historical backtests
        run: node scripts/backtest-v800-long-4h.mjs
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v800-long-4h-backtest
          path: artifacts/
          if-no-files-found: warn
