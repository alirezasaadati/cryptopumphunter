name: Temporary current engine verification backtest
on:
  push:
    branches:
      - backtest/current-engine-transfer-20261125
    paths:
      - ".github/workflows/temporary-current-engine-verification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run current futures engine on 24 Kraken perpetual markets for 60 days
        env:
          BACKTEST_DAYS: "60"
          BACKTEST_SYMBOLS: "24"
          BACKTEST_FEE: "0.0005"
          BACKTEST_SLIPPAGE: "0.0003"
        run: node scripts/backtest-kraken.mjs
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-engine-transfer-verification
          path: artifacts/
          if-no-files-found: warn
