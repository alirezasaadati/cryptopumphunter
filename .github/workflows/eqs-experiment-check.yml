name: EQS experimental branch checks

on:
  push:
    branches:
      - experiment/eqs-diagnostics-20261124
  workflow_dispatch:
    inputs:
      days:
        description: Historical days (7-90)
        required: false
        default: "30"
      symbols:
        description: Maximum Kraken symbols (1-15)
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  test-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare untouched main baseline
        run: |
          git fetch origin main
          git worktree add --detach /tmp/eqs-baseline origin/main
      - name: Syntax and unit tests
        run: npm test
      - name: Run real Kraken Futures EQS diagnostics
        env:
          EQS_BASELINE_MODULE: /tmp/eqs-baseline/src/index.js
          EQS_BACKTEST_DAYS: ${{ inputs.days || '30' }}
          EQS_BACKTEST_SYMBOLS: ${{ inputs.symbols || '10' }}
        run: node scripts/backtest-eqs-diagnostics.mjs
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqs-diagnostics-${{ github.sha }}
          path: |
            artifacts/eqs-diagnostics.json
            artifacts/eqs-diagnostics.md
          if-no-files-found: warn
