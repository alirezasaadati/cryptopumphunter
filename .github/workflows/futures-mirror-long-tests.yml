name: Futures mirror-long engine tests
on:
  workflow_dispatch:
  push:
    branches: [experimental/futures-mirror-long]
    paths: [src/futures-mirror-long.js, scripts/futures-mirror-long.test.mjs, src/index.js]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm test