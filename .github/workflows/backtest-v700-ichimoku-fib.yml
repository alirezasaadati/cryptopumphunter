name: v7.0.0 LONG Ichimoku Fib historical backtest
on:
  push:
    branches: [backtest/v700-ichimoku-fib-20261122]
    paths:
      - "scripts/backtest-v700-ichimoku-fib.mjs"
      - ".github/workflows/backtest-v700-ichimoku-fib.yml"
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v7.0.0 historical backtest
        run: node scripts/backtest-v700-ichimoku-fib.mjs
      - name: Upload v7.0.0 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v700-ichimoku-fib-backtest
          path: artifacts/
          if-no-files-found: warn
