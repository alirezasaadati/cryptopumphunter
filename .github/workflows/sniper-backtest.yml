name: Sniper breakout strategy backtest
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/sniper-backtest.mjs"
      - ".github/workflows/sniper-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Repository tests
        run: npm test
      - name: 60-day comparison on up to 24 contracts
        env:
          BACKTEST_DAYS: "60"
          BACKTEST_SYMBOLS: "24"
          BACKTEST_FEE: "0.0005"
          BACKTEST_SLIPPAGE: "0.0003"
        run: node scripts/sniper-backtest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sniper-strategy-backtest
          path: artifacts/
          if-no-files-found: warn
