name: v10.5 portfolio 30pct backtest
on:
  push:
    branches:
      - backtest-v10-5-one-year-20261122
    paths:
      - "scripts/backtest-v10-5-one-year.mjs"
      - "scripts/backtest-v10-5-portfolio-30pct.mjs"
      - ".github/workflows/v10-5-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run v10.5 historical backtest
        run: set -o pipefail; node scripts/backtest-v10-5-portfolio-30pct.mjs | tee backtest.log
      - name: Upload report and trade ledger
        uses: actions/upload-artifact@v4
        with:
          name: v10-5-portfolio-30pct-one-year
          path: |
            out/summary.json
            out/trades.csv
            backtest.log
          if-no-files-found: error
          retention-days: 14
