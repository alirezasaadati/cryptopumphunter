name: BTC SMC One-Year Backtest
on:
  push:
    branches: [experiment/smc-liquidity-choch-fvg-engine]
    paths:
      - "src/smc-signal-engine.js"
      - "scripts/smc-backtest.mjs"
      - ".github/workflows/smc-backtest.yml"
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Run BTC one-year SMC backtest
        run: node scripts/smc-backtest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: btc-smc-one-year-backtest
          path: artifacts/
          if-no-files-found: error
