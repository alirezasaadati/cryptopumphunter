name: Experimental SMC historical comparison

on:
  pull_request:
    paths:
      - "src/smc-engine.js"
      - "src/price-action-engine.js"
      - "scripts/backtest-smc-comparison.mjs"
      - ".github/workflows/smc-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run historical comparison
        env:
          SMC_BACKTEST_DAYS: "30"
          SMC_BACKTEST_SYMBOLS: "3"
          BACKTEST_FEE: "0.0005"
          BACKTEST_SLIPPAGE: "0.0003"
        run: node scripts/backtest-smc-comparison.mjs
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: smc-price-action-comparison
          path: |
            artifacts/smc-comparison.json
            artifacts/smc-comparison.md
          if-no-files-found: error
