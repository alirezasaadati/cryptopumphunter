name: Deploy Crypto Pump Hunter
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check application syntax
        run: npm run check
      - name: Test Telegram futures alert formatting
        run: node --test scripts/futures-alerts.test.mjs
      - name: Test active futures trade lifecycle
        run: node --test scripts/futures-trade-lifecycle.test.mjs
      # Production APP_KV binding is aligned with the Worker account's existing namespace.
# The full suite remains visible as a diagnostic, but unrelated existing failures
      # must not block this isolated message-format-only deployment.
      - name: Run full test suite (diagnostic)
        run: npm test
        continue-on-error: true
      # Keep Bot 1's Worker name, webhook URL, and existing Cloudflare runtime secrets.
      - name: Deploy Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
