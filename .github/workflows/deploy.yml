name: Deploy Crypto Pump Hunter
on:
  push:
    branches:
      - main
      - maintenance/remove-spot-button-20261124
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run full test suite
        run: npm test
      # Keep Bot 1's Worker name, webhook URL, and existing Cloudflare runtime secrets.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
