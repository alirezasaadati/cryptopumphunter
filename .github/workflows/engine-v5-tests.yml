name: Engine V5 tests
on:
  pull_request:
    paths: ["engine-v5/**", ".github/workflows/engine-v5-tests.yml"]
  push:
    branches: ["engine-v5-design"]
    paths: ["engine-v5/**", ".github/workflows/engine-v5-tests.yml"]
  workflow_dispatch:
jobs:
  engine-v5-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine-v5 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: node --check src/index.js
      - name: Run Engine V5 tests
        run: node --test tests/*.test.mjs
  public-exchange-smoke:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine-v5 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run read-only Kraken public API smoke tests
        run: npm run smoke
        timeout-minutes: 3
  historical-backtest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine-v5 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run 90-day Kraken Futures historical paper backtest
        run: npm run backtest
        env:
          BACKTEST_DAYS: "90"
          BACKTEST_INSTRUMENTS: "PF_XBTUSD,PF_ETHUSD,PF_SOLUSD"
        timeout-minutes: 15
      - name: Upload historical backtest report
        uses: actions/upload-artifact@v4
        with:
          name: engine-v5-historical-backtest-kraken-90d
          path: engine-v5/historical-backtest-report.json
          if-no-files-found: error
