name: Engine V5 tests

on:
  pull_request:
    paths:
      - "engine-v5/**"
      - ".github/workflows/engine-v5-tests.yml"
  push:
    branches:
      - "engine-v5-design"
    paths:
      - "engine-v5/**"
      - ".github/workflows/engine-v5-tests.yml"
  workflow_dispatch:

jobs:
  engine-v5-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check src/index.js
      - name: Run Engine V5 tests
        run: node --test tests/*.test.mjs

  public-exchange-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only public API smoke tests
        run: npm run smoke
        timeout-minutes: 3

  historical-backtest:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 180-day historical paper backtest with 90-day holdout
        run: npm run backtest
        env:
          BACKTEST_DAYS: "180"
          BACKTEST_SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT,AVAXUSDT"
        timeout-minutes: 15
      - name: Upload historical backtest report
        uses: actions/upload-artifact@v4
        with:
          name: engine-v5-historical-backtest-180d
          path: engine-v5/historical-backtest-report.json
          if-no-files-found: error
