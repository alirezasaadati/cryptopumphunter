name: XAUT independent intraday LONG-SHORT backtest
on:
  push:
    branches:
      - experiment/xaut-independent-long-short-v1-20261123
    paths:
      - "experimental/xaut-intraday-backtest.mjs"
      - ".github/workflows/xaut-intraday-backtest.yml"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run XAUT-only historical backtest
        env:
          XAUT_DAYS: "180"
          XAUT_FEE: "0.0005"
          XAUT_SLIPPAGE: "0.0002"
        run: node experimental/xaut-intraday-backtest.mjs
      - name: Upload report and trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-independent-intraday-backtest
          path: artifacts/
          if-no-files-found: error
