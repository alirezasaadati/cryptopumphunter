name: Futures 60-day out-of-sample pullback limit-entry validation

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/futures-backtest-60d
    paths:
      - "scripts/backtest-futures-lifecycle.mjs"
      - "src/index.js"
      - "src/futures-trade-lifecycle.js"
      - ".github/workflows/futures-backtest-60d.yml"

permissions:
  contents: read

concurrency:
  group: futures-backtest-60d
  cancel-in-progress: false

jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pullback_pct: "0"
          - pullback_pct: "0.5"
          - pullback_pct: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental/futures-backtest-60d
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Run 60-day futures lifecycle backtest
        env:
          LIFECYCLE_BACKTEST_DAYS: "60"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
          LIFECYCLE_BACKTEST_END_MS: "1795258800000"
          LIFECYCLE_BREAK_EVEN_MARGIN_PCT: "0"
          LIFECYCLE_STRUCTURAL_STOP_MODE: "original"
          LIFECYCLE_STRUCTURAL_STOP_BUFFER_ATR: "0.2"
          LIFECYCLE_ENTRY_PULLBACK_PCT: "${{ matrix.pullback_pct }}"
          LIFECYCLE_RISK_PER_TRADE_PCT: "1"
          LIFECYCLE_BACKTEST_SYMBOL_LIST: "PF_XBTUSD,PF_ETHUSD,PF_SOLUSD,PF_ZECUSD,PF_HYPEUSD,PF_XRPUSD,PF_NEARUSD,PF_NVDAXUSD,PF_ADAUSD"
        run: node scripts/backtest-futures-lifecycle.mjs
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-lifecycle-pullback-${{ matrix.pullback_pct }}pct-60d
          path: |
            artifacts/futures-lifecycle-backtest.json
            artifacts/futures-lifecycle-backtest.md
          if-no-files-found: warn
          retention-days: 30
