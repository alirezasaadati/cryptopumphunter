name: Current engine indicator benchmark
on:
  push:
    branches: [experiment/current-engine-indicator-benchmark]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Repository tests
        run: npm test
      - name: 90-day BTCUSDT indicator benchmark
        run: node scripts/btcusdt-indicator-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btcusdt-indicator-benchmark
          path: artifacts/btcusdt-indicator-benchmark.*
          if-no-files-found: warn
          retention-days: 30
