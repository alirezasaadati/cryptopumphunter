name: One-year mixed-regime 15m breakout + 5m confirmation validation
on:
  push:
    branches: [daily-4h-15m-backtest]
    paths:
      - '.github/workflows/current-engine-30d-check.yml'
      - 'src/index.js'
      - 'scripts/backtest-kraken.mjs'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run one-year mixed-regime entry model validation
        env:
          BACKTEST_START: '2024-11-19T00:00:00Z'
          BACKTEST_END: '2025-11-19T00:00:00Z'
          BACKTEST_DAYS: '365'
          BACKTEST_SYMBOLS: '8'
          BACKTEST_FEE: '0.0005'
          BACKTEST_SLIPPAGE: '0.0003'
        run: node scripts/backtest-kraken.mjs
      - name: Upload one-year report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-year-mixed-regime-15m-breakout-5m-confirmation
          path: artifacts/
          if-no-files-found: warn
