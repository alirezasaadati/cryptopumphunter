name: Experimental entry models — historical bull-market validation
on:
  push:
    branches: [bull-market-backtest-2025]
    paths:
      - '.github/workflows/current-engine-30d-check.yml'
      - 'src/index.js'
      - 'scripts/backtest-kraken.mjs'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fixed historical bull-market entry model validation
        env:
          BACKTEST_START: '2025-04-10T00:00:00Z'
          BACKTEST_END: '2025-06-09T00:00:00Z'
          BACKTEST_DAYS: '60'
          BACKTEST_SYMBOLS: '24'
          BACKTEST_FEE: '0.0005'
          BACKTEST_SLIPPAGE: '0.0003'
        run: node scripts/backtest-kraken.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bull-market-entry-model-comparison-2025
          path: artifacts/
          if-no-files-found: warn