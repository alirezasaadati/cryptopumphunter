name: BTCUSDT paper runner checks
on:
  push:
    branches: [experiment/btcusdt-paper-variants-4h-1h-15m]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check scripts/btcusdt-paper-variants.mjs
