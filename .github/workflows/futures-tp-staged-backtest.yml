name: Experimental futures TP1 TP2 TP3 backtest
on:
  push:
    branches: [experiment/futures-engine-import-20261124]
    paths:
      - "scripts/backtest-futures-lifecycle.mjs"
      - ".github/workflows/futures-tp-staged-backtest.yml"
      - "src/index.js"
      - "src/futures-trade-lifecycle.js"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax and project checks
        run: |
          npm run check
          node --check scripts/backtest-futures-lifecycle.mjs
      - name: Run 30-day staged TP backtest
        env:
          LIFECYCLE_BACKTEST_DAYS: "30"
          LIFECYCLE_BACKTEST_SYMBOLS: "10"
        run: node scripts/backtest-futures-lifecycle.mjs
      - name: Upload staged TP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-tp1-tp2-tp3-30d-experiment
          path: artifacts/
          if-no-files-found: warn
