name: Rabbit strategy backtest
on:
  workflow_dispatch:
  push:
    branches: [experiment/compare-current-v48-15pct-20261123]
    paths:
      - "src/rabbit-engine.js"
      - "scripts/rabbit-engine.test.mjs"
      - "scripts/backtest-rabbit.mjs"
      - ".github/workflows/rabbit-backtest.yml"
jobs:
  rabbit-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Rabbit unit tests
        run: node --test scripts/rabbit-engine.test.mjs
      - name: Run Rabbit 90d and 180d Kraken backtests
        run: node scripts/backtest-rabbit.mjs
      - name: Upload Rabbit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-backtest-90d-180d
          path: artifacts/
          if-no-files-found: warn
