name: Rabbit strategy backtest
on:
  workflow_dispatch:
  push:
    branches: [experiment/compare-current-v48-15pct-20261123, experiment/rabbit-diagnostics-365d-mtm-20261123, experiment/rabbit-btc-only-123d-20261123, experiment/rabbit-btc-gold-90d-20261123]
    paths:
      - "src/rabbit-engine.js"
      - "scripts/rabbit-engine.test.mjs"
      - "scripts/backtest-rabbit.mjs"
      - "scripts/backtest-rabbit-btc-only.mjs"
      - "scripts/backtest-rabbit-btc-gold.mjs"
      - ".github/workflows/rabbit-backtest.yml"
jobs:
  rabbit-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Rabbit unit tests
        run: node --test scripts/rabbit-engine.test.mjs
      - name: Run Rabbit matched BTC vs Gold 90d Kraken backtest with MTM diagnostics
        run: node scripts/backtest-rabbit-btc-gold.mjs
      - name: Upload Rabbit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-backtest-btc-gold-90d-mtm
          path: artifacts/
          if-no-files-found: warn
