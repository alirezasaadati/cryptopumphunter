name: Three-engine futures backtest (common fill model)
on:
  push:
    branches: [backtest-three-engines]
    paths:
      - "scripts/candidate-engine.mjs"
      - "scripts/backtest-three-engines.mjs"
      - ".github/workflows/backtest-three-engines.yml"
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check scripts/candidate-engine.mjs
          node --check scripts/backtest-three-engines.mjs
      - name: Run backtest
        env:
          BACKTEST_DAYS: "90"
          BACKTEST_SYMBOLS: "8"
          BACKTEST_FEE: "0.0005"
          BACKTEST_SLIPPAGE: "0.0003"
        run: node scripts/backtest-three-engines.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-engine-backtest
          path: artifacts/
          if-no-files-found: warn
