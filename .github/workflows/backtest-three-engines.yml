name: Hybrid-only 12-month regime backtest
on:
  push:
    branches: [backtest-three-engines]
    paths:
      - "scripts/candidate-engine.mjs"
      - "scripts/backtest-three-engines.mjs"
      - ".github/workflows/backtest-three-engines.yml"
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check scripts/candidate-engine.mjs
          node --check scripts/backtest-three-engines.mjs
      - name: Run hybrid-only 12-month backtest
        env:
          BACKTEST_DAYS: "365"
          BACKTEST_SYMBOLS: "8"
          BACKTEST_FEE: "0.0005"
          BACKTEST_SLIPPAGE: "0.0003"
        run: node scripts/backtest-three-engines.mjs
      - name: Upload hybrid report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-12m-backtest
          path: artifacts/
          if-no-files-found: warn
