name = "cryptopumphunter"
main = "src/index.js"
compatibility_date = "2026-11-16"

[vars]
SIGNAL_ARCHIVE_CHANNEL_ID = "-1004299421807"

[[kv_namespaces]]
binding = "APP_KV"
id = "d4c16773401b4c119d59f995142c1aa7"

[triggers]
crons = ["*/5 * * * *"]

[secrets]
required = ["BOT_TOKEN", "OWNER_TELEGRAM_ID", "WEBHOOK_SECRET", "SIGNAL_DELIVERY_AUTH_SECRET"]


[[durable_objects.bindings]]
name = "SIGNAL_DELIVERY"
class_name = "SignalDeliveryCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalDeliveryCoordinator"]

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[previews.vars]
ENVIRONMENT = "preview"
SIGNAL_ARCHIVE_CHANNEL_ID = ""

[[previews.kv_namespaces]]
binding = "APP_KV"
id = "2931a4ee170e495badcc65b53e3c0c51"

[[previews.durable_objects.bindings]]
name = "SIGNAL_DELIVERY"
class_name = "SignalDeliveryCoordinator"
