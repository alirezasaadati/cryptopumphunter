name = "cryptopumphunter"
main = "src/index.js"
compatibility_date = "2026-11-16"

[vars]
APP_MODE = "manual"
MIN_SIGNAL_SCORE = "72"
SIGNAL_TTL_MINUTES = "60"
MAX_ENTRY_DRIFT_PCT = "0.35"
MAX_SCAN_SYMBOLS = "8"

[[kv_namespaces]]
binding = "APP_KV"
id = "dab441cdffc0460faeb497cee6edd314"

[triggers]
crons = ["*/5 * * * *"]

[secrets]
required = ["OWNER_TELEGRAM_ID", "SIGNAL_DELIVERY_SECRET"]


[[durable_objects.bindings]]
name = "SIGNAL_DELIVERY"
class_name = "SignalDeliveryCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalDeliveryCoordinator"]
