name = "cryptopumphunter-staging"
main = "src/index.js"
compatibility_date = "2026-11-16"

[vars]
APP_MODE = "manual"
MIN_SIGNAL_SCORE = "72"
SIGNAL_TTL_MINUTES = "60"
MAX_ENTRY_DRIFT_PCT = "0.35"
MAX_SCAN_SYMBOLS = "8"
STAGING_MODE = "true"

# IMPORTANT: Create a NEW KV namespace dedicated to staging and replace this
# placeholder. Never copy the production namespace ID from wrangler.toml.
[[kv_namespaces]]
binding = "APP_KV"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"

# No cron trigger in staging. Tests are initiated manually only.
